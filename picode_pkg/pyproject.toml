[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picode"
version = "0.2.15"
description = "PiCode — CLI coding agent for PiGPT API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "pigpt" }]
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "paramiko>=3.4",
]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.6"]

[project.scripts]
picode = "picode.cli:app"
picode-desktop = "picode.desktop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["picode*"]

[tool.setuptools.package-data]
picode = ["fonts/*.ttf", "assets/*"]
