name: Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'release (default) or debug'
        required: false
        default: release
        type: choice
        options: [release, debug]
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'release' }}
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64 --tree-shake-icons

      - name: Build debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug' }}
        working-directory: mobile
        run: flutter build apk --debug

      - name: Prepare artifact
        working-directory: mobile
        run: |
          mkdir -p dist
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/android.apk
          else
            cp build/app/outputs/flutter-apk/app-debug.apk dist/android.apk
          fi
          ls -lh dist/android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/dist/android.apk
          if-no-files-found: error
          retention-days: 30
