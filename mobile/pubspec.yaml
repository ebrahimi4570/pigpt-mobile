name: pigpt_mobile
description: PiGPT — Persian AI platform mobile app (Flutter).
publish_to: "none"
version: 1.2.0+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.7
  markdown: ^7.3.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  intl: ^0.20.2
  collection: ^1.19.1
  equatable: ^2.0.7
  flutter_animate: ^4.5.2
  package_info_plus: ^8.3.0
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  flutter_tts: ^4.2.3
  app_links: ^6.4.0
  connectivity_plus: ^6.1.5
  record: ^6.0.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.4.0
  gal: ^2.3.1
  audioplayers: ^6.1.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/brand-pi-512.png
  adaptive_icon_background: "#0E1A2E"
  adaptive_icon_foreground: assets/brand/brand-pi-512.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
