name: pigpt_mobile
description: PiGPT — Persian AI platform mobile app (Flutter).
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.7
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  intl: ^0.20.2
  collection: ^1.19.1
  equatable: ^2.0.7
  flutter_animate: ^4.5.2
  package_info_plus: ^8.3.0
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
